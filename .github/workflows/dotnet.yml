name: RaceDay CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore RaceDay_API.sln

      - name: Build API and MVC solution
        run: dotnet build RaceDay_API.sln --configuration Release --no-restore

      - name: Build MVC project
        run: dotnet build RaceDay_MVC/RaceDay_MVC.csproj --configuration Release --no-restore

      - name: Run API unit tests
        run: dotnet test RaceDay_API.Tests/RaceDay_API.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
